[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "virtual-fly-lab"
version = "0.1.0"
description = "A minimal NeuroMechFly locomotion experiment using FlyGym 2.x"
requires-python = ">=3.12,<3.13"
dependencies = ["flygym==2.1.0", "mujoco==3.9.0", "numpy==2.5.3"]

[project.scripts]
virtual-fly-lab = "virtual_fly_lab.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_fly_lab"]
